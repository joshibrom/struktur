[workspace]
members = ["crates/struktur-cli", "crates/struktur-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Joshua Ibrom <joshuaibrom@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshibrom/struktur"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
directories = "5.0"
rusqlite = { version = "0.31", features = ["bundled", "time"] }
